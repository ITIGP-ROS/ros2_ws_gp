amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.1   # Rotation noise from rotation (reduce over-spreading when spinning)
    alpha2: 0.2   # Rotation noise from translation (keep moderate)
    alpha3: 0.3   # Translation noise from translation (ackermann slips slightly)
    alpha4: 0.3   # Translation noise from rotation (spread particles wider in turns)
    alpha5: 0.1   # Only used by omnidirectional model
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 15.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field_prob"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # ⚠️ WITHOUT THIS, AN UNATTENDED NAV2 COMES UP HALF-DEAD -- and does not recover.
    # AMCL publishes map->odom only once it has a pose. planner_server's global costmap
    # (global_frame: map) blocks in Costmap2DROS::activate() on canTransform(map,
    # base_link) in a `while (rclcpp::ok() && ...)` loop that NEVER times out, so
    # lifecycle_manager's change_state call times out and it logs "Failed to bring up all
    # requested nodes. Aborting bringup." -- leaving behavior_server, bt_navigator,
    # waypoint_follower and velocity_smoother NEVER ACTIVATED. Setting the initial pose in
    # RViz afterwards unblocks planner_server but does NOT bring those four back:
    # lifecycle_manager has already given up, so goals go nowhere with no error.
    #
    # (0, 0, 0) IS THE POSE THE MAP WAS BUILT FROM. slam_toolbox originates the map frame
    # at the vehicle's pose when mapping starts, so the origin is where the vehicle stood
    # and yaw 0 is the heading it faced. Verified against the maps rather than assumed:
    # map (0,0) lands on an OBSERVED-FREE cell in both home.pgm (pixel 273,103) and
    # makerspace.pgm (pixel 85,582) -- it would be UNKNOWN or OCCUPIED if this convention
    # did not hold. So if the vehicle is parked where mapping began, this is not a guess,
    # it is correct, and the operator's correction is a refinement rather than a rescue.
    #
    # ⚠️ MARGIN IS THIN AT THE HOME ORIGIN: clearance there is 0.45 m against an
    # inflation_radius of 0.40 -- only 0.05 m outside inflated-lethal space. It plans fine
    # today. If inflation_radius is ever raised back toward the 0.45/0.60 the older
    # comments in this file argue for, (0,0) lands INSIDE the inflated region and a goal
    # sent before the operator re-localises fails with "Starting point in lethal space!".
    # Move this pose if you move that radius. (makerspace has 0.90 m and is unaffected.)
    #
    # Being WRONG here is expected and safe by design: the operator sets the true pose
    # (locate.py, or RViz) before driving, AMCL resets its filter, and nav2_bt.xml already
    # clears BOTH costmaps at goal acceptance so obstacles marked while mislocalised are
    # discarded. What this buys is a stack that is fully ACTIVE and ready to accept that
    # correction, instead of one that is half-activated and cannot.
    #
    # NOT a substitute for locate.py. AMCL reports a tiny covariance while confidently
    # wrong; only a scan-match score says the pose explains the LiDAR. Below 60%, do not
    # drive.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    transform_tolerance: 0.3
    update_min_a: 0.10
    update_min_d: 0.15
    z_hit: 0.65
    z_max: 0.0
    z_rand: 0.35
    z_short: 0.0
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    default_nav_to_pose_bt_xml: "replace/with/path/to/bt.xml"
    default_nav_through_poses_bt_xml: "replace/with/path/to/bt.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
