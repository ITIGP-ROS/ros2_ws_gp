controller_manager:
  ros__parameters:
    update_rate: 30
#    use_sim_time is false by default
#    true during sim by adding gz_control_sim_time.yaml to gazebo plugin in urdf

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    static_covariance_orientation: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_angular_velocity: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_linear_acceleration: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]

ackermann_controller:
  ros__parameters:
    # Drive wheels (velocity)
    rear_wheels_names:
      - rear_right_wheel_joint
      - rear_left_wheel_joint
    
    # Steering joints (position) - NOT the wheel joints!
    front_wheels_names:
      - front_right_steering_joint
      - front_left_steering_joint

    # Geometry
    wheelbase: 0.23529
    rear_wheel_track: 0.18179
    front_wheel_track: 0.12
    front_wheels_radius: 0.0325
    rear_wheels_radius: 0.0325
    front_steering: true

    # ⚠️ THIS PARAMETER IS INERT - ackermann_steering_controller DOES NOT READ IT.
    # The controller declares exactly five parameters: wheelbase, front_wheel_track,
    # rear_wheel_track, front_wheels_radius, rear_wheels_radius. "max_steering_angle"
    # is not among them, and it appears nowhere in the nav2/ros2_control install except
    # gazebo_plugins. An undeclared key in a --param-file is silently ignored, which is
    # why the controller still loads. Kept only because the VALUE is now correct and
    # documents intent; do not rely on it to clamp anything.
    #
    # The clamps that actually exist, both SYMMETRIC at 0.286 rad (16.4 deg):
    #   firmware   Vehicle-Control steering_control.c:70-71  SC_LIMIT_LEFT/RIGHT_RAD
    #   host       ackermann_hardware/src/ackermann_system.cpp  STEER_MAX_LEFT/RIGHT
    #   simulation ackermann_description/urdf/base.xacro  steering_max (URDF joint limit)
    #
    # The old note here read "Real travel is asymmetric L +0.2421 / R -0.3037". That is
    # FALSE and was corrected 2026-08-27. Those were pre-2026-08-16 servo/pot-side
    # figures, never wheel-angle measurements, wrong by ~2.3x left and ~1.9x right
    # because the pot sits upstream of the linkage (servo_cfg.h says so at length).
    # 0.286 rad -> minimum turning radius L/tan(0.286) = 0.80 m, both directions.
    max_steering_angle: 0.286

    # Controller params
    #
    # 0.4s: was 0.1s. Measured live on teleop_twist_keyboard (2026-08-20,
    # `ros2 topic hz /cmd_vel_teleop` while driving): gaps up to 0.215s between
    # messages during continuous key-repeat -- bigger than the old 0.1s timeout,
    # so the controller was zeroing the command almost every repeat cycle. That
    # was the jitter/dropped-frames symptom. 0.4s gives ~2x margin over the
    # measured 0.215s worst case. Kept below twist_mux's 0.5s per-source timeout
    # (twist_mux_topics.yaml) on purpose: twist_mux never publishes a zero Twist
    # on timeout, it just stops relaying, so this reference_timeout is the only
    # actual deadman that halts the wheels when input stops -- it must stay
    # faster than mux's own handoff decision.
    reference_timeout: 0.4
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: true
    use_stamped_vel: true
    
    # TF
    #
    # These name the edge odom -> base_footprint, which ekf_filter_node ALREADY OWNS
    # (ekf.yaml: world_frame: odom, odom_frame: odom, base_link_frame: base_footprint,
    # publish_tf defaults true). enable_odom_tf stays false so there is exactly one
    # publisher of that transform.
    #
    # Flipping this to true on its own now does NOTHING: the controller publishes to
    # ~/tf_odometry, and robot.launch.py no longer remaps that onto /tf. Restoring the
    # EKF-less fallback -- wheel odometry supplying odom -> base_footprint when
    # robot_localization is not running -- takes BOTH this flag and that remap.
    #
    # Never turn both on while ekf_filter_node is up. Two publishers on one TF edge give a
    # jittering, non-deterministic transform underneath the whole navigation stack.
    #
    # Note this only gates the TRANSFORM. The ~/odometry topic that feeds the EKF
    # (ekf.yaml odom0) is published regardless.
    # 🔴 THE CONTROLLER'S DEFAULT COVARIANCE IS PLACEHOLDER JUNK - set it explicitly.
    # steering_controllers_library declares
    #     twist_covariance_diagonal = {0.0, 7.0, 14.0, 21.0, 28.0, 35.0}
    # which is an index sequence, not a covariance. Leaving it unset published a vx
    # variance of ZERO - telling the EKF that wheel odometry speed is perfect and can
    # never be corrected - and a yaw-rate variance of 35, which any filter would ignore.
    #
    # Values below are MEASURED, not guessed (bag 20260827_073550, 200 AMCL intervals):
    #   yaw rate: the steering-derived heading error is 0.0140 rad per ~2.5 s interval
    #     against the IMU's 0.0078, i.e. a variance ratio of (0.0140/0.0078)^2 = 3.2.
    #     imu_broadcaster declares 0.01 for angular velocity and imu_scale.py multiplies
    #     it by k^2, giving 0.0132 at k=1.148. 0.0132 * 3.2 = 0.042 keeps the two yaw
    #     sources in the ratio the measurement actually supports, without touching the
    #     IMU's own declaration.
    #   vx: 0.001 (std 0.032 m/s) - encoder odometry on a hard floor, loose enough that
    #     the EKF will still correct it, unlike the 0.0 it was publishing.
    # Unused axes are given small-but-nonzero values; a zero variance anywhere is a trap.
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.01, 0.01, 0.042]
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false