controller_manager:
  ros__parameters:
    update_rate: 30
#    use_sim_time is false by default
#    true during sim by adding gz_control_sim_time.yaml to gazebo plugin in urdf

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

imu_broadcaster:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    static_covariance_orientation: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_angular_velocity: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]
    static_covariance_linear_acceleration: [0.01, 0.0, 0.0, 0.0, 0.01, 0.0, 0.0, 0.0, 0.01]

ackermann_controller:
  ros__parameters:
    # Drive wheels (velocity)
    rear_wheels_names:
      - rear_right_wheel_joint
      - rear_left_wheel_joint
    
    # Steering joints (position) - NOT the wheel joints!
    front_wheels_names:
      - front_right_steering_joint
      - front_left_steering_joint

    # Geometry
    wheelbase: 0.23529
    rear_wheel_track: 0.18179
    front_wheel_track: 0.12
    front_wheels_radius: 0.0325
    rear_wheels_radius: 0.0325
    front_steering: true
    # 0.2421 = the OLD, pre-calibration value.
    #
    # 2026-08-16 the Tiva steering calibration was re-measured and flashed (car-like
    # 42b6fed): the previous constants came from a CAD figure and the servo-horn pot
    # rather than the road wheels, and were wrong by 2.31x left / 1.91x right. The
    # firmware clamp is now 0.286 rad (R = 0.80 m), so this value UNDER-uses the
    # vehicle: R = 0.95 m instead of 0.80 m.
    #
    # Safe, because a clamp SMALLER than the mechanical reality only costs capability
    # -- it cannot make the vehicle over-steer. So it is deliberately left alone until
    # the perception team's ground check passes (one circle at delta 0.15 rad,
    # expected ~3.10 m diameter against 1.30 m before). They asked us not to bake it
    # before that, and we have not.
    #
    # WHEN IT LANDS, THREE VALUES MOVE AS ONE CHANGE:
    #     controllers.yaml max_steering_angle       0.2421 -> 0.286
    #     nav2_amcl.yaml   minimum_turning_radius   1.00   -> 0.84
    #     nav2_amcl.yaml   min_turning_r (MPPI)     1.00   -> 0.84
    # 0.84 NOT 0.80 -- see the reasoning recorded in nav2_amcl.yaml. Do not raise the
    # clamp past 0.286 either: above it the RIGHT side is completely unmeasured (every
    # endpoint run was a left-hand circle) and the delivered angle starts moving with
    # battery voltage (100.5% at 11.5 V vs 90.5% at 11.4 V for the same command).
    max_steering_angle: 0.2421 # 13.87 deg = real LEFT mechanical limit (Tiva steering_control.c); conservative symmetric clamp for Nav2 consistency. Real travel is asymmetric L +0.2421 / R -0.3037.

    # Controller params
    reference_timeout: 0.1
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: true
    use_stamped_vel: true
    
    # TF
    #
    # These name the edge odom -> base_footprint, which ekf_filter_node ALREADY OWNS
    # (ekf.yaml: world_frame: odom, odom_frame: odom, base_link_frame: base_footprint,
    # publish_tf defaults true). enable_odom_tf stays false so there is exactly one
    # publisher of that transform.
    #
    # Flipping this to true on its own now does NOTHING: the controller publishes to
    # ~/tf_odometry, and robot.launch.py no longer remaps that onto /tf. Restoring the
    # EKF-less fallback -- wheel odometry supplying odom -> base_footprint when
    # robot_localization is not running -- takes BOTH this flag and that remap.
    #
    # Never turn both on while ekf_filter_node is up. Two publishers on one TF edge give a
    # jittering, non-deterministic transform underneath the whole navigation stack.
    #
    # Note this only gates the TRANSFORM. The ~/odometry topic that feeds the EKF
    # (ekf.yaml odom0) is published regardless.
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false